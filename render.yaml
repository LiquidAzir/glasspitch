services:
  - type: web
    name: glasspitch
    runtime: static
    rootDir: .
    buildCommand: node scripts/build-static.cjs
    staticPublishPath: dist
    headers:
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /favicon.png
        name: Cache-Control
        value: public, max-age=86400
